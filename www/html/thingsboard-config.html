<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <title>ThingsBoard Configuration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            height: 100vh;
            background-color: #333;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .wrapper {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 1200px;
            min-height: 830px;
        }
        
        .container {
            width: 40%;
            padding: 20px;
            background-color: #444;
            border-radius: 8px;
        }
        
        .right-container {
            width: 40%;
            padding: 20px;
            background-color: #555;
            border-radius: 8px;
        }
        
        h1, h2 {
            text-align: center;
        }
        
        button {
            padding: 8px 16px;
            background-color: #00e1ff;
            border: none;
            border-radius: 4px;
            color: #000000;
            cursor: pointer;
            margin-bottom: 10px; /* Adds spacing between buttons */
        }
        
        button:hover {
            background-color: #3ffd6e;
        }
        
        input[type="number"],
        input[type="text"] {
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
        }
        
        .home-button,        
        .back-button {            
            position: absolute;            
            top: 20px;            
            left: 20px;            
            padding: 10px 20px;            
            background-color: #00e1ff;            
            border-radius: 5px;            
            color: black;            
            text-decoration: none;            
            font-weight: bold;
            width: 50px;             
            text-align: center;       
        }  
        .back-button {
            top: 70px;
        }
        .home-button:hover,
        .back-button:hover {
            background-color: #3ffd6e;
        }

        /* Checkbox Styling */
        input[type="checkbox"] {
            margin-right: 10px;
        }

        /* Styling for the notification boxes */
        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 5px;
            color: white;
            font-size: 14px;
            opacity: 1;
            transition: opacity 0.5s ease-out;
            z-index: 1000;
        }

        .notification.success {
            background-color: #4CAF50; /* Green */
        }

        .notification.error {
            background-color: #f44336; /* Red */
        }

        .notification.info {
            background-color: #2196F3;
        }

        /* Fading out effect */
        .notification.hide {
            opacity: 0;
        }

        .ETH {
            background-color: #a200ff; /* Red */
        }
        .DAN {
            background-color: #ff0000; /* Red */
        }

        .table-list-container {
            margin-top: 7px;
            background: #333;
            border-radius: 8px;
            padding: 10px;
        }
        .table-list-title {
            margin-bottom: 10px;
            font-size: 1.2em;
            color: #fff;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: color 0.2s;
        }
        .table-list-title:hover {
            color: #3ffd6e;
        }
        .table-list-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 0;
            padding: 0;
        }
        .table-list-grid .table-item {
            background: #444;
            padding: 5px 12px;
            border-radius: 2px;
            color: #fff;
            font-family: monospace;
            font-size: 1em;
            transition: background 0.2s;
            margin: 0;
            list-style: none;
            text-align: center;
        }
        .table-list-grid.revealed {
            display: grid;
        }


        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #fff;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-label {
            margin-bottom: 0;
        }

        input[type="url"],
        input[type="password"],
        input[type="text"],
        input[type="number"],
        select {
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 4px;
            width: 100%;
        }

        input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
        }

        .section {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #666;
        }

        .section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .section-title {
            margin: 0 0 14px;
            font-size: 17px;
            color: #fff;
        }

        .help-text {
            margin: 5px 0 0;
            color: #aaa;
            font-size: 12px;
            font-style: italic;
        }

        .two-column {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .button-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 18px;
        }

        /* .btn-save {
            background-color: #28a745;
            color: #fff;
        }

        .btn-save:hover {
            background-color: #218838;
        } */

        .btn-cancel {
            background-color: #6c757d;
            color: #fff;
        }

        .btn-cancel:hover {
            background-color: #5a6268;
        }

        .btn-test {
            background-color: #007bff;
            color: #fff;
        }

        .btn-test:hover {
            background-color: #0056b3;
        }

        .status-message {
            display: none;
            margin-top: 0;
            padding: 12px 16px;
            border-radius: 4px;
            font-size: 14px;
        }

        .status-message.success,
        .status-message.error,
        .status-message.info {
            display: block;
            color: #fff;
        }

        .status-message.success {
            background-color: #4caf50;
            border: 1px solid #45a049;
        }

        .status-message.error {
            background-color: #f44336;
            border: 1px solid #da190b;
        }

        .status-message.info {
            background-color: #2196f3;
            border: 1px solid #0b7dda;
        }

        .disabled-section {
            opacity: 0.5;
            pointer-events: none;
        }

        /* .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 5px;
            border-radius: 50%;
        }

        .status-indicator.enabled {
            background-color: #28a745;
        }

        .status-indicator.disabled {
            background-color: #6c757d;
        } */

        @media (min-width: 761px) and (max-height: 830px) {
            body {
                align-items: flex-start;
            }
        }

        @media (max-width: 760px) {
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            body {
                height: auto;
                min-height: 100vh;
                align-items: flex-start;
            }

            .wrapper {
                flex-direction: column;
                align-items: center;
                gap: 12px;
                min-height: 0;
                margin: 12px auto 20px;
            }

            .container,
            .right-container {
                width: calc(100% - 24px);
            }

            .two-column {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <main class="container">
            <a href="/" class="home-button">Home</a>
            <a href="/config.html" class="back-button">Back </a>
            <h1>ThingsBoard Configuration</h1>

            <form id="thingsboardForm" class="scroll-area">
            <!-- Enable/Disable Section -->
            <div class="section">
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="enableThingsboard" name="thingsboard_enabled">
                    <label for="enableThingsboard" class="checkbox-label">
                        <!-- <span class="status-indicator disabled" id="statusIndicator"></span> -->
                        Enable ThingsBoard Upload
                    </label>
                </div>
                <!-- <p class="help-text">
                    Enable this to automatically upload your sensor data to ThingsBoard cloud platform.
                </p> -->
            </div>

            <!-- ThingsBoard Connection Settings -->
            <div class="section" id="connectionSection">
                <h3 class="section-title">Connection Settings</h3>

                <div class="form-group">
                    <label for="thingsboardUrl">ThingsBoard Server URL</label>
                    <input type="url" id="thingsboardUrl" name="thingsboard_url"
                           placeholder="https://data.echengineering.co.uk"
                           required>
                    <p class="help-text">
                        Example: https://data.echengineering.co.uk
                    </p>
                </div>

                <div class="form-group">
                    <label for="thingsboardToken">Device Authentication Token</label>
                    <input type="password" id="thingsboardToken" name="thingsboard_token"
                           placeholder="Enter your ThingsBoard device token"
                           required>
                    <p class="help-text">
                        Your unique device token from ThingsBoard. Keep this secure!
                    </p>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <button type="button" class="btn-test" onclick="testConnection()">
                        Test Connection
                    </button>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="batchSize">Batch Size</label>
                    <input type="number" id="batchSize" name="batch_size"
                            min="1" max="1000" value="100" required>
                    <p class="help-text">
                        Rows per upload (1-1000)
                    </p>
                </div>
            </div>

            <div class="section" id="networkSection">
                <h3 class="section-title">Network and Cellular</h3>
                <div class="form-group">
                    <label for="uplinkMode">Uplink Mode</label>
                    <select id="uplinkMode" name="uplink_mode">
                        <option value="auto">Automatic</option>
                        <option value="eth0">Ethernet (eth0)</option>
                        <option value="ppp0">Cellular (ppp0)</option>
                    </select>
                </div>
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="cellularEnabled" name="cellular_enabled">
                    <label for="cellularEnabled" class="checkbox-label">Enable Cellular</label>
                </div>
                <div class="form-group">
                    <label for="activeCarrier">Carrier</label>
                    <select id="activeCarrier" name="active_carrier">
                        <option value="">Loading carriers...</option>
                    </select>
                </div>
                <div id="customApnFields" hidden>
                    <div class="form-group">
                        <label for="customApn">Custom APN</label>
                        <input type="text" id="customApn">
                    </div>
                </div>
                <!-- <div class="form-group">
                    <label for="loggerId">Logger ID (WiFi SSID)</label>
                    <input type="text" id="loggerId" readonly>
                </div> -->
            </div>

            </form>

            <div class="button-group">
                <!-- <button type="button" class="btn-cancel" onclick="loadConfig()">Reload</button> -->
                <button type="submit" form="thingsboardForm" class="btn-save">Save</button>
            </div>
        </main>

        <aside class="right-container">
            <h1>Status</h1>
        </aside>
    </div>

    <script>
        /**
         * ThingsBoard Configuration JavaScript
         * Handles loading, saving, and testing ThingsBoard configuration
         */

        document.addEventListener('DOMContentLoaded', function() {
            loadConfig();

            document.getElementById('enableThingsboard').addEventListener('change', function() {
                updateUIState();
            });
            document.getElementById('cellularEnabled').addEventListener('change', updateCellularUI);
            document.getElementById('activeCarrier').addEventListener('change', updateCellularUI);

            document.getElementById('thingsboardForm').addEventListener('submit', function(e) {
                e.preventDefault();
                saveConfig();
            });
        });

        function loadConfig() {
            showStatus('Loading configuration...', 'info');

            const flaskPort = ':8000';
            let currentHostname = window.location.hostname || 'localhost';

            fetch(`http://${currentHostname}${flaskPort}/configs`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                document.getElementById('enableThingsboard').checked = data.thingsboard_enabled || false;
                document.getElementById('thingsboardUrl').value = data.thingsboard_url || '';
                document.getElementById('thingsboardToken').value = data.thingsboard_token || '';
                document.getElementById('batchSize').value = data.batch_size || 100;
                // document.getElementById('checkInterval').value = data.check_interval || 300;
                document.getElementById('uplinkMode').value = data.uplink_mode || 'auto';
                document.getElementById('cellularEnabled').checked = data.cellular_enabled || false;
                // document.getElementById('loggerId').value = data.logger_ID || '';

                return fetch(`http://${currentHostname}${flaskPort}/getapn`)
                    .then(apnResponse => {
                        if (!apnResponse.ok) {
                            throw new Error(`HTTP error loading carrier APNs: ${apnResponse.status}`);
                        }
                        return apnResponse.json();
                    })
                    .then(carriers => {
                        const carrierSelect = document.getElementById('activeCarrier');
                        carrierSelect.innerHTML = '<option value="">Select a carrier</option>';
                        Object.keys(carriers).forEach(carrier => {
                            const option = document.createElement('option');
                            option.value = carrier;
                            option.textContent = carrier;
                            carrierSelect.appendChild(option);
                        });
                        const customOption = document.createElement('option');
                        customOption.value = 'custom';
                        customOption.textContent = 'Custom APN';
                        carrierSelect.appendChild(customOption);
                        carrierSelect.value = data.active_carrier || '';

                        const customApn = data.custom_apn || {};
                        document.getElementById('customApn').value = customApn.apn || '';

                        updateUIState();
                        updateCellularUI();
                        showStatus('Configuration loaded successfully', 'success');
                    });
            })
            .catch(error => {
                showStatus(`Error loading configuration: ${error.message}`, 'error');
                console.error('Error:', error);
            });
        }

        function saveConfig() {
            const flaskPort = ':8000';
            let currentHostname = window.location.hostname || 'localhost';

            showStatus('Loading current configuration...', 'info');

            fetch(`http://${currentHostname}${flaskPort}/configs`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(currentConfig => {
                const config = {
                    logInterval: currentConfig.logInterval || 300,
                    dbTable: currentConfig.dbTable || 'data',
                    SHT: currentConfig.SHT !== undefined ? currentConfig.SHT : true,
                    CamEnable: currentConfig.CamEnable || 'none',
                    thingsboard_enabled: document.getElementById('enableThingsboard').checked,
                    thingsboard_url: document.getElementById('thingsboardUrl').value.trim(),
                    thingsboard_token: document.getElementById('thingsboardToken').value.trim(),
                    batch_size: parseInt(document.getElementById('batchSize').value),
                    check_interval: currentConfig.check_interval || 5,
                    uplink_mode: document.getElementById('uplinkMode').value,
                    cellular_enabled: document.getElementById('cellularEnabled').checked,
                    active_carrier: document.getElementById('activeCarrier').value,
                    custom_apn: {
                        apn: document.getElementById('customApn').value.trim()
                    },
                    logger_ID: currentConfig.logger_ID || ''
                };

                if (config.thingsboard_enabled) {
                    if (!config.thingsboard_url) {
                        showStatus('Please enter ThingsBoard Server URL', 'error');
                        return;
                    }
                    if (!config.thingsboard_token) {
                        showStatus('Please enter Device Authentication Token', 'error');
                        return;
                    }
                    if (!isValidUrl(config.thingsboard_url)) {
                        showStatus('Please enter a valid URL', 'error');
                        return;
                    }
                }

                if (config.batch_size < 1 || config.batch_size > 1000) {
                    showStatus('Batch size must be between 1 and 1000', 'error');
                    return;
                }

                if (config.check_interval < 1 || config.check_interval > 3600) {
                    showStatus('Check interval must be between 1 and 3600 seconds', 'error');
                    return;
                }

                showStatus('Saving configuration...', 'info');

                fetch(`http://${currentHostname}${flaskPort}/configs`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(config)
                })
                .then(response => {
                    if (!response.ok) {
                        return response.text().then(text => {
                            throw new Error(`HTTP ${response.status}: ${text}`);
                        });
                    }
                    return response.text();
                })
                .then(data => {
                    showStatus('✓ Configuration saved successfully!', 'success');
                    loadConfig();
                })
                .catch(error => {
                    showStatus(`✗ Error saving configuration: ${error.message}`, 'error');
                    console.error('Error:', error);
                });
            })
            .catch(error => {
                showStatus(`✗ Error loading current configuration: ${error.message}`, 'error');
                console.error('Error:', error);
            });
        }

        function testConnection() {
            const url = document.getElementById('thingsboardUrl').value.trim();
            const token = document.getElementById('thingsboardToken').value.trim();

            if (!url || !token) {
                showStatus('Please enter both URL and token before testing', 'error');
                return;
            }

            if (!isValidUrl(url)) {
                showStatus('Please enter a valid URL', 'error');
                return;
            }

            showStatus('Testing connection...', 'info');

            let currentHostname = window.location.hostname;
            if (currentHostname === '') {
                currentHostname = 'localhost';
            }

            fetch(`http://${currentHostname}:8000/test-connection`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    thingsboard_url: url,
                    thingsboard_token: token
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    showStatus(`✓ Successfully connected to ThingsBoard (via ${data.interface || 'auto'})`, 'success');
                } else {
                    showStatus(`✗ Connection failed (via ${data.interface || 'auto'}): ${data.message}`, 'error');
                }
            })
            .catch(error => {
                showStatus(`✗ Could not reach the logger to run the test: ${error.message}`, 'error');
                console.error('Error:', error);
            });
        }

        function updateUIState() {
            const enabled = document.getElementById('enableThingsboard').checked;
            const connectionSection = document.getElementById('connectionSection');

            if (enabled) {
                connectionSection.classList.remove('disabled-section');
            } else {
                connectionSection.classList.add('disabled-section');
            }
        }

        function updateCellularUI() {
            const enabled = document.getElementById('cellularEnabled').checked;
            const carrier = document.getElementById('activeCarrier');
            carrier.disabled = !enabled;
            carrier.required = enabled;
            document.getElementById('customApnFields').hidden = !enabled || carrier.value !== 'custom';
        }

        function showStatus(message, type) {
            const notification = document.createElement('div');
            notification.classList.add('notification', type);
            notification.textContent = message;
            notification.setAttribute('role', 'status');
            notification.setAttribute('aria-live', 'polite');
            document.body.appendChild(notification);

            setTimeout(() => {
                notification.classList.add('hide');
                setTimeout(() => {
                    notification.remove();
                }, 500);
            }, 3000);
        }

        function isValidUrl(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }
    </script>
</body>
</html>
