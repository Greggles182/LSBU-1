<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fetch Current Host</title>
</head>
<body>
  <script>
    // Get the full host (hostname and port if present)
    const currentHost = window.location.host;
    console.log("Current host (with port):", currentHost);
    
    // Get only the hostname (without port)
    const currentHostname = window.location.hostname;
    console.log("Current hostname:", currentHostname);
  </script>
</body>
</html>
